# Kronos Hub: 4 serviços, uma imagem. O kronos.toml mora no volume `config` (`kronos init` o cria); os segredos ficam no volume `cofre`.
# TLS fica por sua conta (Caddy/Traefik na frente do painel; o README traz o bloco).
x-base: &base
  image: ${KRONOS_IMAGEM:-kronos-hub:latest}  # KRONOS_IMAGEM só muda o nome (scripts/teste-instalacao.sh usa um nome próprio)
  build: .
  restart: unless-stopped
  init: true  # PID 1 repassa o SIGTERM (docker stop rápido)
  environment: &env
    KRONOS_CONFIG: /etc/kronos/kronos.toml
    HUB_DATA: /var/lib/kronos
    NIMBUS_HOME: /var/lib/kronos/home
    KRONOS_LOCK_DIR: /tmp
  volumes:
    - dados:/var/lib/kronos
    - home:/home/kronos  # logins do claude/codex sobrevivem a recriar o contêiner
    - config:/etc/kronos  # volume (não arquivo): /comecar grava o toml por tmp + os.replace, que não funciona em bind de arquivo

services:
  painel:
    <<: *base
    command: ["painel"]
    ports:
      - "${KRONOS_PAINEL_PORTA:-8787}:${KRONOS_PAINEL_PORTA:-8787}"
    environment:
      <<: *env
      KRONOS_PAINEL_PORTA: "${KRONOS_PAINEL_PORTA:-8787}"
      KRONOS_CAMINHOS_SEGREDOS: /etc/kronos/cofre  # senha do dono e tokens (painel.env...) ficam no volume do cofre
    volumes:
      - dados:/var/lib/kronos
      - home:/home/kronos
      - cofre:/etc/kronos/cofre
      - config:/etc/kronos  # volume (não arquivo): /comecar grava o toml por tmp + os.replace, que não funciona em bind de arquivo

  agenda:
    <<: *base
    command: ["agenda"]
    healthcheck:
      disable: true
    environment:
      <<: *env
      KRONOS_CAMINHOS_SEGREDOS: /etc/kronos/cofre
    # Ações seguras apenas (rerodar-rotina, limpar-* dentro do volume). `reiniciar-servico` só com o socket do Docker:
    # desligado por padrão; para ligar, monte /var/run/docker.sock e defina KRONOS_DOCKER_SOCKET=1 (dá poder de root no host).
    volumes:
      - dados:/var/lib/kronos
      - home:/home/kronos
      - cofre:/etc/kronos/cofre
      - config:/etc/kronos  # volume (não arquivo): /comecar grava o toml por tmp + os.replace, que não funciona em bind de arquivo

  webhook:
    <<: *base
    command: ["webhook"]
    ports:  # só no loopback: o seu proxy TLS (Caddy/Traefik) fica na frente e aponta para 127.0.0.1:8790
      - "127.0.0.1:${KRONOS_WEBHOOK_PORTA:-8790}:8790"
    healthcheck:
      disable: true

  mcp:
    <<: *base
    command: ["mcp"]
    ports:
      - "127.0.0.1:${KRONOS_MCP_PORTA:-4181}:4181"
    healthcheck:
      disable: true

volumes:
  dados:
  home:
  config:
  cofre:
