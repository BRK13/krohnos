# Static site for Kronos Hub self-host page. Served from /usr/share/nginx/html (output of build.py).
# TLS is terminated by the platform proxy (Dokploy/Traefik) in front of this container, port 80.

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/plain text/css text/markdown application/javascript application/xml image/svg+xml;

# www -> apex, permanent
server {
    listen 80;
    server_name www.krohnos.com;
    return 301 https://krohnos.com$request_uri;
}

server {
    listen 80 default_server;
    server_name krohnos.com _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript application/xml image/svg+xml;

    server_tokens off;

    # Security headers (strict CSP: everything is same-origin, no CDN, no inline script or style).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Plain text, never HTML. (.md is not in mime.types, so default_type applies.)
    location ~ \.md$ {
        default_type text/plain;
        expires 5m;
    }
    location = /llms.txt {
        default_type text/plain;
        expires 5m;
    }
    location = /robots.txt {
        default_type text/plain;
        expires 1h;
    }
    location = /sitemap.xml {
        default_type application/xml;
        expires 1h;
    }

    # Versioned-by-deploy static assets: long cache.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        # add_header in a location drops the server-level ones, so repeat them here.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
        expires 5m;
    }
}
